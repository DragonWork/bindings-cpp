name: Publish
on:
  workflow_dispatch:
  release:
    types: [published]
permissions:
  contents: read
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false
jobs:
  prebuild:
    if: github.repository == 'DragonWork/bindings-cpp'
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: darwin
            os: macos-latest
            node: x64
            command: prebuildify
            args: --arch x64+arm64

          - name: win32-x86
            os: windows-latest
            node: x64
            command: prebuildify
            args: --arch ia32

          - name: win32-x64
            os: windows-latest
            node: x64
            command: prebuildify

          - name: win32-arm64
            os: windows-latest
            node: x64
            command: prebuildify
            args: --arch arm64 --tag-armv 8

          - name: linux-x64
            os: ubuntu-latest
            node: x64
            command: prebuildify-cross
            args: -i almalinux-devtoolset11 --tag-libc --libc glibc

          - name: linux-x64-musl
            os: ubuntu-latest
            node: x64
            command: prebuildify-cross
            # already has --tag-libc --libc musl
            args: -i alpine

          - name: linux-arm64
            os: ubuntu-latest
            node: x64
            command: prebuildify-cross
            args: -i linux-arm64 --tag-libc --libc glibc

          - name: linux-arm64-musl
            os: ubuntu-latest
            node: x64
            command: prebuildify-cross
            args: -i linux-arm64-musl --tag-libc --libc musl

          - name: linux-arm
            os: ubuntu-latest
            node: x64
            command: prebuildify-cross
            args: -i linux-armv7 -i linux-armv6 --tag-libc --libc glibc

          - name: linux-arm-musl
            os: ubuntu-latest
            node: x64
            command: prebuildify-cross
            args: -i linux-armv7l-musl --tag-libc --libc musl

          - name: android-arm
            os: ubuntu-latest
            node: x64
            command: prebuildify-cross
            args: -i android-armv7

          - name: android-arm64
            os: ubuntu-latest
            node: x64
            command: prebuildify-cross
            args: -i android-arm64

    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.14'
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 26
          architecture: ${{ matrix.node }}
          package-manager-cache: false
      - uses: actions/checkout@v7.0.1
      - run: npm ci --ignore-scripts
      - run: npm run ${{ matrix.command }} -- ${{ matrix.args }}
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: build-artifacts-${{ matrix.name }}
          path: prebuilds/
          if-no-files-found: error
      - if: failure()
        run: npx shx ls -lA
  release:
    needs: prebuild
    name: Release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/download-artifact@v8.0.1
        with:
          pattern: build-artifacts-*
          merge-multiple: true
          path: prebuilds
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 26
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Check release version
        if: github.event_name == 'release'
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: node -e "if (process.env.RELEASE_TAG !== 'v' + require('./package.json').version) throw new Error('Release tag must match package.json version')"
      - run: npm ci
      - run: npm run build
      - run: npm run typecheck
      - run: npm test
        env:
          NODE_OPTIONS: --no-experimental-strip-types
      - run: npm pack
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: npm-package
          path: dragonwork-serialport-bindings-cpp-*.tgz
          if-no-files-found: error
      - name: Publish to npm
        if: github.event_name == 'release'
        run: npm publish dragonwork-serialport-bindings-cpp-*.tgz --access public --tag latest
